<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - LifeBridge Hospital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* à¦Ÿà§à¦¯à¦¾à¦¬ à¦¨à§‡à¦­à¦¿à¦—à§‡à¦¶à¦¨ à¦¸à§à¦Ÿà¦¾à¦‡à¦² */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 2px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 10px 18px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: var(--primary);
      background: #f1f5f9;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #eff6ff;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    /* à¦«à¦¿à¦²à§à¦Ÿà¦¾à¦° à¦Ÿà§à¦²à¦¬à¦¾à¦° */
    .report-filter-bar {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .report-filter-bar .form-group {
      margin-bottom: 0;
      min-width: 160px;
    }

    /* à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦¹à§‡à¦¡à¦¾à¦°à§‡à¦° à¦²à§à¦•à¦¾à¦¨à§‹ à¦…à¦‚à¦¶ (à¦¸à¦¾à¦§à¦¾à¦°à¦£ à¦¸à§à¦•à§à¦°à¦¿à¦¨à§‡ à¦¦à§‡à¦–à¦¾à¦¬à§‡ à¦¨à¦¾) */
    .print-header {
      display: none;
      margin-bottom: 24px;
      border-bottom: 2px solid #000;
      padding-bottom: 12px;
    }
    .print-header h1 {
      margin: 0;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .print-header h2 {
      margin: 6px 0;
      font-size: 18px;
      color: #333;
    }
    .print-header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #555;
    }

    /* à¦¬à§‹à¦²à§à¦¡ à¦Ÿà§‹à¦Ÿà¦¾à¦² à¦°à§‹ à¦¹à¦¾à¦‡à¦²à¦¾à¦‡à¦Ÿ */
    .total-row {
      font-weight: 800;
      background-color: #f1f5f9 !important;
      border-top: 2px solid #334155 !important;
      border-bottom: 2px solid #334155 !important;
    }
    .total-row td {
      color: #0f172a !important;
      font-size: 14px;
    }

    /* à¦¡à§‡à¦‡à¦²à¦¿à¦° à¦œà¦¨à§à¦¯ à¦Ÿà§‹à¦Ÿà¦¾à¦² à¦¡à¦¿à¦‰ à¦¹à¦¾à¦‡à¦²à¦¾à¦‡à¦Ÿ à¦•à¦¾à¦°à§à¦¡ */
    .due-stat-banner {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-left: 4px solid var(--warning);
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .due-stat-banner strong {
      font-size: 18px;
      color: #c2410c;
    }

    /* à¦«à¦¾à¦à¦•à¦¾ à¦¡à§‡à¦Ÿà¦¾ à¦¬à¦¾à¦°à§à¦¤à¦¾ */
    .no-data-msg {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-light);
      font-style: italic;
    }

    /* @media print à¦°à§à¦²à¦¸: à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦•à¦°à¦¾à¦° à¦¸à¦®à§Ÿ à¦¶à§à¦§à§ à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦¥à¦¾à¦•à¦¬à§‡ */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      .layout {
        display: block !important;
      }
      .sidebar,
      .page-header,
      .tab-bar,
      .report-filter-bar,
      .btn,
      #alertBox {
        display: none !important;
      }
      .main-content {
        padding: 0 !important;
        margin: 0 !important;
      }
      .card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        background: transparent !important;
      }
      .print-header {
        display: block !important;
      }
      .table-scroll {
        overflow: visible !important;
      }
      table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      th, td {
        border: 1px solid #333 !important;
        padding: 6px 10px !important;
        color: #000 !important;
      }
      .total-row {
        background-color: #eee !important;
      }
      .badge {
        border: 1px solid #333 !important;
        background: transparent !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="layout">
    <!-- à¦¬à¦¾à¦à¦¦à¦¿à¦•à§‡à¦° à¦—à§à¦²à§‹à¦¬à¦¾à¦² à¦¸à¦¾à¦‡à¦¡à¦¬à¦¾à¦° -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- à¦®à§‚à¦² à¦•à¦¨à¦Ÿà§‡à¦¨à§à¦Ÿ à¦à¦²à¦¾à¦•à¦¾ -->
    <main class="main-content">
      
      <!-- à¦…à¦¨à¦¸à§à¦•à§à¦°à¦¿à¦¨ à¦ªà§‡à¦œ à¦¹à§‡à¦¡à¦¾à¦° -->
      <div class="page-header">
        <h1 class="page-title">ðŸ“Š Financial & Operational Reports</h1>
        <p class="page-desc">Audit hospital revenue collections, track patient footfall, and review doctor/lab performance.</p>
      </div>

      <!-- à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿà§‡à¦° à¦¸à¦®à§Ÿ à¦¦à§‡à¦–à¦¾à¦¨à§‹à¦° à¦¬à¦¿à¦¶à§‡à¦· à¦…à¦«à¦¿à¦¶à¦¿à§Ÿà¦¾à¦² à¦¹à§‡à¦¡à¦¾à¦° -->
      <div class="print-header">
        <h1>LifeBridge Hospital</h1>
        <h2 id="printReportTitle">Hospital Report</h2>
        <p id="printDateRange">Period: All Dates</p>
        <p style="font-size:11px; margin-top:2px;">Printed on: <span id="printGeneratedOn"></span></p>
      </div>

      <!-- à¦Ÿà§à¦¯à¦¾à¦¬ à¦®à§‡à¦¨à§ (à¦šà¦¾à¦°à¦Ÿà¦¿ à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ) -->
      <nav class="tab-bar" role="tablist">
        <button type="button" class="tab-btn active" id="tabBtn-daily" onclick="switchTab('daily')">
          ðŸ’µ Daily Collection
        </button>
        <button type="button" class="tab-btn" id="tabBtn-patients" onclick="switchTab('patients')">
          ðŸ‘¥ Patient Registration List
        </button>
        <button type="button" class="tab-btn" id="tabBtn-doctors" onclick="switchTab('doctors')">
          ðŸ‘¨â€âš•ï¸ Doctor-wise Visits & Fees
        </button>
        <button type="button" class="tab-btn" id="tabBtn-lab" onclick="switchTab('lab')">
          ðŸ§ª Lab Tests Summary
        </button>
      </nav>

      <!-- à¦«à¦¿à¦²à§à¦Ÿà¦¾à¦° à¦Ÿà§à¦²à¦¬à¦¾à¦° (à¦¤à¦¾à¦°à¦¿à¦– à¦¸à¦¿à¦²à§‡à¦•à¦¶à¦¨ à¦“ à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦¬à¦¾à¦Ÿà¦¨) -->
      <div class="report-filter-bar">
        <div class="form-group">
          <label for="fromDate">From Date:</label>
          <input type="date" id="fromDate" onchange="runCurrentReport()">
        </div>

        <div class="form-group">
          <label for="toDate">To Date:</label>
          <input type="date" id="toDate" onchange="runCurrentReport()">
        </div>

        <div>
          <button type="button" class="btn btn-primary" onclick="runCurrentReport()">
            Show Report
          </button>
        </div>

        <div style="margin-left: auto;">
          <button type="button" class="btn btn-secondary" onclick="triggerPrint()">
            ðŸ–¨ï¸ Print Report
          </button>
        </div>
      </div>

      <!-- à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦•à¦¨à¦Ÿà§‡à¦¨à§à¦Ÿ à¦•à¦¾à¦°à§à¦¡ -->
      <div class="card" id="reportDisplayCard">
        <div id="reportContainer">
          <!-- à¦¡à¦¾à§Ÿà¦¨à¦¾à¦®à¦¿à¦• à¦œà¦¾à¦­à¦¾à¦¸à§à¦•à§à¦°à¦¿à¦ªà§à¦Ÿ à¦¦à¦¿à§Ÿà§‡ à¦à¦–à¦¾à¦¨à§‡ à¦Ÿà§‡à¦¬à¦¿à¦² à¦“ à¦¡à§‡à¦Ÿà¦¾ à¦¤à§ˆà¦°à¦¿ à¦¹à¦¬à§‡ -->
        </div>
      </div>

    </main>
  </div>

  <!-- à¦ªà§à¦°à§Ÿà§‹à¦œà¦¨à§€à§Ÿ à¦œà¦¾à¦­à¦¾à¦¸à§à¦•à§à¦°à¦¿à¦ªà§à¦Ÿ à¦«à¦¾à¦‡à¦²à¦—à§à¦²à§‹ à¦²à§‹à¦¡ à¦•à¦°à¦¾ -->
  <script src="db.js"></script>
  <script src="reports.js"></script>
  <script>
    // à¦•à§‹à¦¨ à¦Ÿà§à¦¯à¦¾à¦¬ à¦à¦–à¦¨ à¦¸à¦•à§à¦°à¦¿à§Ÿ à¦°à§Ÿà§‡à¦›à§‡ à¦¤à¦¾ à¦Ÿà§à¦°à§à¦¯à¦¾à¦• à¦•à¦°à¦¾
    let activeTab = 'daily';

    // à¦ªà§‡à¦œ à¦²à§‹à¦¡ à¦¹à¦²à§‡ à¦¸à¦¾à¦‡à¦¡à¦¬à¦¾à¦° à¦à¦¬à¦‚ à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦¶à§à¦°à§ à¦¹à¦¬à§‡
    document.addEventListener('DOMContentLoaded', function() {
      // à¦¸à¦¾à¦‡à¦¡à¦¬à¦¾à¦° à¦¦à§‡à¦–à¦¾à¦¨à§‹
      renderSidebar('reports');

      // à¦¤à¦¾à¦°à¦¿à¦– à¦‡à¦¨à¦¿à¦¶à¦¿à§Ÿà¦¾à¦²à¦¾à¦‡à¦œà§‡à¦¶à¦¨: à¦šà¦²à¦¤à¦¿ à¦®à¦¾à¦¸à§‡à¦° à§§ à¦¤à¦¾à¦°à¦¿à¦– à¦¥à§‡à¦•à§‡ à¦†à¦œ à¦ªà¦°à§à¦¯à¦¨à§à¦¤
      document.getElementById('fromDate').value = monthStartStr();
      document.getElementById('toDate').value = todayStr();

      // à¦ªà§‚à¦°à§à¦¬à§‡ à¦¨à¦¿à¦°à§à¦¬à¦¾à¦šà¦¨ à¦•à¦°à¦¾ à¦Ÿà§à¦¯à¦¾à¦¬ à¦¥à¦¾à¦•à¦²à§‡ à¦¸à§‡à¦Ÿà¦¿ à¦«à¦¿à¦°à¦¿à§Ÿà§‡ à¦†à¦¨à¦¾ (localStorage à¦¥à§‡à¦•à§‡)
      const savedTab = localStorage.getItem('hms_activeReportTab');
      if (savedTab && ['daily', 'patients', 'doctors', 'lab'].includes(savedTab)) {
        activeTab = savedTab;
      }

      // à¦¸à¦•à§à¦°à¦¿à§Ÿ à¦Ÿà§à¦¯à¦¾à¦¬à§‡à¦° à¦¬à§‹à¦¤à¦¾à¦®à§‡ active à¦•à§à¦²à¦¾à¦¸ à¦¦à§‡à¦“à§Ÿà¦¾
      updateTabButtons();

      // à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦ªà§à¦°à¦¦à¦°à§à¦¶à¦¨ à¦•à¦°à¦¾
      runCurrentReport();
    });

    /**
     * à¦Ÿà§à¦¯à¦¾à¦¬ à¦ªà¦°à¦¿à¦¬à¦°à§à¦¤à¦¨ à¦•à¦°à¦¾ à¦à¦¬à¦‚ à¦†à¦—à§‡à¦° à¦ªà¦›à¦¨à§à¦¦ à¦®à¦¨à§‡ à¦°à¦¾à¦–à¦¾
     */
    function switchTab(tabKey) {
      activeTab = tabKey;
      localStorage.setItem('hms_activeReportTab', tabKey);
      updateTabButtons();
      runCurrentReport();
    }

    /**
     * à¦Ÿà§à¦¯à¦¾à¦¬à§‡à¦° à¦¬à¦¾à¦Ÿà¦¨à§‡à¦° à¦°à¦‚ à¦¹à¦¾à¦²à¦¨à¦¾à¦—à¦¾à¦¦ à¦•à¦°à¦¾
     */
    function updateTabButtons() {
      ['daily', 'patients', 'doctors', 'lab'].forEach(t => {
        const btn = document.getElementById('tabBtn-' + t);
        if (btn) {
          if (t === activeTab) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        }
      });
    }

    /**
     * à¦¬à¦°à§à¦¤à¦®à¦¾à¦¨ à¦…à§à¦¯à¦¾à¦•à§à¦Ÿà¦¿à¦­ à¦Ÿà§à¦¯à¦¾à¦¬à§‡à¦° à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦°à¦¾à¦¨ à¦•à¦°à¦¾
     */
    function runCurrentReport() {
      const from = document.getElementById('fromDate').value;
      const to = document.getElementById('toDate').value;
      const container = document.getElementById('reportContainer');

      // à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦¹à§‡à¦¡à¦¾à¦°à§‡à¦° à¦¶à¦¿à¦°à§‹à¦¨à¦¾à¦® à¦“ à¦¤à¦¥à§à¦¯ à¦¸à§‡à¦Ÿ à¦•à¦°à¦¾
      updatePrintHeader(from, to);

      if (!from || !to) {
        container.innerHTML = '<div class="alert alert-danger">Please choose both From and To dates.</div>';
        return;
      }

      // à¦¤à¦¾à¦°à¦¿à¦– à¦‰à¦²à§à¦Ÿà§‹ à¦¹à¦²à§‡ à¦¸à¦‚à¦¶à§‹à¦§à¦¨
      if (from > to) {
        container.innerHTML = '<div class="alert alert-danger">"From Date" cannot be after "To Date"!</div>';
        return;
      }

      // à¦¸à¦•à§à¦°à¦¿à§Ÿ à¦Ÿà§à¦¯à¦¾à¦¬ à¦…à¦¨à§à¦¯à¦¾à§Ÿà§€ à¦¨à¦¿à¦°à§à¦¦à¦¿à¦·à§à¦Ÿ à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ à¦°à§‡à¦¨à§à¦¡à¦¾à¦°
      switch (activeTab) {
        case 'daily':
          renderDailyCollectionTab(from, to, container);
          break;
        case 'patients':
          renderPatientsTab(from, to, container);
          break;
        case 'doctors':
          renderDoctorTab(from, to, container);
          break;
        case 'lab':
          renderLabTab(from, to, container);
          break;
      }
    }

    /**
     * à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦¹à§‡à¦¡à¦¾à¦°à§‡à¦° à¦œà¦¨à§à¦¯ à¦²à§‡à¦–à¦¾ à¦¸à§‡à¦Ÿ à¦•à¦°à¦¾
     */
    function updatePrintHeader(from, to) {
      const titleElem = document.getElementById('printReportTitle');
      const rangeElem = document.getElementById('printDateRange');
      const genElem = document.getElementById('printGeneratedOn');

      const titles = {
        daily: 'Daily Revenue Collection Audit',
        patients: 'Patient Registration Directory',
        doctors: 'Doctor-wise Consultation & Fee Analysis',
        lab: 'Diagnostic Pathology & Lab Investigation Summary'
      };

      if (titleElem) titleElem.textContent = titles[activeTab] || 'Hospital Management Report';
      if (rangeElem) rangeElem.textContent = `Date Range: ${formatDate(from)} to ${formatDate(to)}`;
      if (genElem) genElem.textContent = new Date().toLocaleString();
    }

    /**
     * à§§. Daily Collection à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ
     */
    function renderDailyCollectionTab(from, to, container) {
      // reports.js-à¦à¦° pure calculation à¦«à¦¾à¦‚à¦¶à¦¨ à¦•à¦²
      const data = getDailyCollection(from, to);

      let html = `
        <div class="due-stat-banner">
          <div>
            <span style="font-size:14px; color:#9a3412;">Current Hospital-wide Unpaid Balance:</span><br>
            <strong style="font-size:20px;">Total Unpaid Due: ${formatMoney(data.totalDue)}</strong>
          </div>
          <div style="font-size:13px; color:#78350f;">
            Note: All-time outstanding due across all patients (not limited by date filter).
          </div>
        </div>

        <h3 style="margin-top:0; font-size:16px;">Daily Payment Breakdown</h3>
      `;

      if (data.rows.length === 0) {
        html += `<div class="no-data-msg">No collection records found for this date range.</div>`;
        container.innerHTML = html;
        return;
      }

      html += `
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Payment Date</th>
                <th style="text-align: right;">Doctor Visit Collection</th>
                <th style="text-align: right;">Lab Test Collection</th>
                <th style="text-align: right;">Total Received</th>
              </tr>
            </thead>
            <tbody>
      `;

      data.rows.forEach(r => {
        html += `
          <tr>
            <td><strong>${formatDate(r.date)}</strong> (${r.date})</td>
            <td style="text-align: right;">${formatMoney(r.visits)}</td>
            <td style="text-align: right;">${formatMoney(r.lab)}</td>
            <td style="text-align: right; font-weight:700; color:var(--primary);">${formatMoney(r.total)}</td>
          </tr>
        `;
      });

      // à¦¬à§‹à¦²à§à¦¡ à¦Ÿà§‹à¦Ÿà¦¾à¦² à¦°à§‹ (à¦¨à¦¿à¦šà§‡)
      html += `
            </tbody>
            <tfoot>
              <tr class="total-row">
                <td>GRAND TOTAL (${data.rows.length} active day${data.rows.length === 1 ? '' : 's'})</td>
                <td style="text-align: right;">${formatMoney(data.totalVisits)}</td>
                <td style="text-align: right;">${formatMoney(data.totalLab)}</td>
                <td style="text-align: right; color:var(--success); font-size:15px;">${formatMoney(data.totalReceived)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    /**
     * à§¨. Patient Registration List à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ
     */
    function renderPatientsTab(from, to, container) {
      const data = getPatientsInRange(from, to);

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0; font-size:16px;">Registered Patients Directory</h3>
          <span class="badge badge-info" style="font-size:13px;">Total Registered: ${data.count}</span>
        </div>
      `;

      if (data.rows.length === 0) {
        html += `<div class="no-data-msg">No patients were registered in this date range.</div>`;
        container.innerHTML = html;
        return;
      }

      html += `
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Patient ID</th>
                <th>Registration Date</th>
                <th>Full Name</th>
                <th>Age / Sex</th>
                <th>Phone Number</th>
                <th>Address</th>
              </tr>
            </thead>
            <tbody>
      `;

      data.rows.forEach(p => {
        html += `
          <tr>
            <td><strong>${p.id}</strong></td>
            <td>${formatDate(p.regDate)}</td>
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td>${p.age} yrs / ${escapeHtml(p.sex)}</td>
            <td>${escapeHtml(p.phone || 'N/A')}</td>
            <td>${escapeHtml(p.address || 'N/A')}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="6" style="text-align: right;">TOTAL PATIENTS REGISTERED: <strong>${data.count}</strong></td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    /**
     * à§©. Doctor-wise Visits & Fees à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ
     */
    function renderDoctorTab(from, to, container) {
      const data = getDoctorReport(from, to);

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0; font-size:16px;">Doctor Consultations & Invoiced Fees</h3>
          <span style="font-size:13px; color:var(--text-light);">Based on visit consultation dates</span>
        </div>
      `;

      if (data.rows.length === 0) {
        html += `<div class="no-data-msg">No doctor consultations recorded in this date range.</div>`;
        container.innerHTML = html;
        return;
      }

      html += `
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Doctor ID</th>
                <th>Doctor Name</th>
                <th>Specialization / Dept</th>
                <th style="text-align: center;">Total Visits</th>
                <th style="text-align: right;">Total Fees Invoiced</th>
              </tr>
            </thead>
            <tbody>
      `;

      data.rows.forEach(d => {
        html += `
          <tr>
            <td><strong>${d.doctorId}</strong></td>
            <td><strong>${escapeHtml(d.name)}</strong></td>
            <td>${escapeHtml(d.department)}</td>
            <td style="text-align: center; font-weight:700;">${d.visits}</td>
            <td style="text-align: right; font-weight:700; color:var(--primary);">${formatMoney(d.fees)}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="3">GRAND TOTAL (${data.rows.length} Doctors)</td>
                <td style="text-align: center; font-size:15px;">${data.totalVisits}</td>
                <td style="text-align: right; color:var(--success); font-size:15px;">${formatMoney(data.totalFees)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    /**
     * à§ª. Lab Tests Summary à¦°à¦¿à¦ªà§‹à¦°à§à¦Ÿ
     */
    function renderLabTab(from, to, container) {
      const data = getLabReport(from, to);

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0; font-size:16px;">Diagnostic Lab Test Orders & Investigation Value</h3>
          <span style="font-size:13px; color:var(--text-light);">Based on order placement dates</span>
        </div>
      `;

      if (data.rows.length === 0) {
        html += `<div class="no-data-msg">No diagnostic orders placed within this date range.</div>`;
        container.innerHTML = html;
        return;
      }

      html += `
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Test Name</th>
                <th style="text-align: center;">Total Ordered</th>
                <th style="text-align: center;">Done (Complete)</th>
                <th style="text-align: center;">Pending Analysis</th>
                <th style="text-align: right;">Total Amount</th>
              </tr>
            </thead>
            <tbody>
      `;

      data.rows.forEach(l => {
        html += `
          <tr>
            <td><strong>${escapeHtml(l.testName)}</strong></td>
            <td style="text-align: center; font-weight:700;">${l.ordered}</td>
            <td style="text-align: center;"><span class="badge badge-success">${l.done}</span></td>
            <td style="text-align: center;"><span class="badge badge-warning">${l.pending}</span></td>
            <td style="text-align: right; font-weight:700; color:var(--primary);">${formatMoney(l.amount)}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
            <tfoot>
              <tr class="total-row">
                <td>GRAND TOTAL (${data.rows.length} Tests)</td>
                <td style="text-align: center; font-size:15px;">${data.totalOrdered}</td>
                <td style="text-align: center;">${data.totalDone}</td>
                <td style="text-align: center;">${data.totalPending}</td>
                <td style="text-align: right; color:var(--success); font-size:15px;">${formatMoney(data.totalAmount)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    /**
     * à¦¬à§à¦°à¦¾à¦‰à¦œà¦¾à¦°à§‡à¦° à¦ªà§à¦°à¦¿à¦¨à§à¦Ÿ à¦¡à¦¾à§Ÿà¦¾à¦²à¦— à¦šà¦¾à¦²à§ à¦•à¦°à¦¾
     */
    function triggerPrint() {
      window.print();
    }
  </script>
  <script src="polish.js"></script>
</body>
