<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Report Assistant - LifeBridge Hospital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Chat layout styling */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: var(--radius, 8px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border, #e2e8f0);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--primary, #4f46e5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header .badge-powered {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #fafbfc;
    }

    /* Message bubbles */
    .chat-bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 3px;
      border: 1px solid #e2e8f0;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    .chat-bubble.error-bubble {
      align-self: flex-start;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-bottom-left-radius: 3px;
    }

    .chat-bubble p {
      margin: 0 0 8px 0;
    }
    .chat-bubble p:last-child {
      margin-bottom: 0;
    }

    .chat-bubble ul {
      margin: 6px 0 6px 20px;
      padding: 0;
    }

    .chat-bubble li {
      margin-bottom: 4px;
    }

    .chat-bubble.user strong {
      color: #ffffff;
    }

    /* Thinking indicator */
    .thinking-indicator {
      display: none;
      align-self: flex-start;
      background: #f1f5f9;
      color: #64748b;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-style: italic;
      border-bottom-left-radius: 3px;
    }

    .thinking-dots::after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Quick suggestions pills */
    .chat-suggestions {
      padding: 10px 16px;
      background: #ffffff;
      border-top: 1px solid var(--border, #e2e8f0);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .suggestion-chip {
      font-size: 12px;
      background: #eef2ff;
      color: #4338ca;
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid #c7d2fe;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .suggestion-chip:hover {
      background: #e0e7ff;
      border-color: #a5b4fc;
      transform: translateY(-1px);
    }

    /* Input bar */
    .chat-input-bar {
      padding: 14px 16px;
      background: #ffffff;
      border-top: 1px solid var(--border, #e2e8f0);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: var(--radius, 8px);
      font-size: 14px;
      outline: none;
    }

    .chat-input-bar input:focus {
      border-color: var(--primary, #4f46e5);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .chat-input-bar button {
      padding: 12px 20px;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .chat-container {
        height: calc(100vh - 80px);
        border-radius: 0;
        border: none;
      }
      .chat-bubble {
        max-width: 90%;
      }
      .suggestion-chip {
        font-size: 11px;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="layout">
    <!-- গ্লোবাল সাইডবার -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- মূল কনটেন্ট এলাকা -->
    <main class="main-content">
      
      <div class="chat-container">
        
        <!-- চ্যাট হেডার -->
        <div class="chat-header">
          <h2>Report Assistant</h2>
          <span class="badge-powered">Powered by ChatterMate</span>
        </div>

        <!-- মেসেজ স্ক্রোলিং এলাকা -->
        <div class="chat-messages" id="chatMessages">
          <!-- স্বাগতম মেসেজ -->
          <div class="chat-bubble assistant">
            Hello! I am your hospital report assistant. Ask me questions about collections, patients, visits, or lab tests based on your hospital's real data.
          </div>
          <!-- Thinking indicator -->
          <div class="thinking-indicator" id="thinkingIndicator">
            Assistant is thinking<span class="thinking-dots"></span>
          </div>
        </div>

        <!-- রেডিমেড উদাহরণ প্রশ্ন চিপ -->
        <div class="chat-suggestions">
          <button type="button" class="suggestion-chip" onclick="askPreset('How much did we collect today?')">
            How much did we collect today?
          </button>
          <button type="button" class="suggestion-chip" onclick="askPreset('How many new patients came this week?')">
            How many new patients came this week?
          </button>
          <button type="button" class="suggestion-chip" onclick="askPreset('Which doctor had the most visits this month?')">
            Which doctor had the most visits this month?
          </button>
          <button type="button" class="suggestion-chip" onclick="askPreset('How many lab tests are still pending?')">
            How many lab tests are still pending?
          </button>
          <button type="button" class="suggestion-chip" onclick="askPreset('Who still owes money?')">
            Who still owes money?
          </button>
          <button type="button" class="suggestion-chip" onclick="askPreset('Delete patient P-0042')">
            Delete patient P-0042
          </button>
        </div>

        <!-- চ্যাট ইনপুট বার -->
        <form class="chat-input-bar" id="chatForm" onsubmit="return handleChatSubmit(event)">
          <input 
            type="text" 
            id="chatInput" 
            placeholder="Ask about patients, visits, tests, money..." 
            autocomplete="off" 
            required
          />
          <button type="submit" id="sendBtn" class="btn btn-primary">Send</button>
        </form>

      </div>

    </main>
  </div>

  <!-- স্ক্রিপ্ট ফাইলগুলো লোড -->
  <script src="db.js"></script>
  <script src="reports.js"></script>
  <script src="chat.js"></script>
  <script>
    // সাইডবার ইনিশিয়ালাইজ করা (নিরাপদ উপায়ে)
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof renderSidebar === 'function') {
        try { renderSidebar('chat'); } catch (e) { console.warn('Sidebar render skipped:', e); }
      }
      var input = document.getElementById('chatInput');
      if (input) input.focus();
    });

    // ক্লিক করে রেডিমেড প্রশ্ন পাঠানো
    function askPreset(questionText) {
      var input = document.getElementById('chatInput');
      if (input) {
        input.value = questionText;
        if (typeof handleChatSubmit === 'function') {
          handleChatSubmit(new Event('submit'));
        }
      }
    }
  </script>
  <script src="polish.js"></script>
</body>
</html>
